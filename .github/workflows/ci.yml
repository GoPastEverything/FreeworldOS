name: CI

on:
  push:
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
          components: llvm-tools-preview,rust-src
          targets: x86_64-unknown-none,x86_64-unknown-uefi

      - name: Build M1 boot images with self-tests
        run: cargo build --features m1-ci-self-test

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Boot M1 BIOS image and verify memory + exception paths
        shell: bash
        run: |
          set -euo pipefail

          BIOS_IMAGE="$(find target -type f -name 'freeworldos-bios.img' -print -quit)"
          test -n "$BIOS_IMAGE"

          set +e
          timeout --signal=TERM --kill-after=2s 8s             qemu-system-x86_64               -drive "format=raw,file=$BIOS_IMAGE"               -serial stdio               -display none               -no-reboot               -no-shutdown               -m 256M             > boot-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat boot-serial.log

          grep -Fq "FreeWorldOS: M1 memory self-test: passed" boot-serial.log
          grep -Fq "FreeWorldOS: EXCEPTION: #BP breakpoint" boot-serial.log
          grep -Fq "FreeWorldOS: M1 exception self-test: resumed" boot-serial.log
          grep -Fq "FreeWorldOS: M1 foundation online" boot-serial.log
          grep -Fq "FreeWorldOS: bootstrap initialization complete" boot-serial.log

          if grep -Fq "KERNEL PANIC" boot-serial.log; then
            echo "kernel panic detected during M1 boot" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi
