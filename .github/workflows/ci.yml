name: CI

on:
  push:
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
          components: llvm-tools-preview,rust-src
          targets: x86_64-unknown-none,x86_64-unknown-uefi

      - name: Build default kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build
          mkdir -p target/ci
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n'               | sort -nr               | head -n 1               | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-default-bios.img

      - name: Build kernel image with self-tests
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m1-ci-self-test,m3-ci-self-test,m35a-ci-self-test,m35b-ci-self-test,m35c-ci-self-test,m35c2b-ci-self-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n'               | sort -nr               | head -n 1               | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-selftest-bios.img

      - name: Build panic-test kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35b-ci-panic-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-panic-bios.img

      - name: Build fatal-test kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35b-ci-fatal-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-fatal-bios.img

      - name: Build task guard-fault kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c-ci-guard-fault-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-task-guard-bios.img

      - name: Build voluntary-switch kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c2c-ci-switch-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-voluntary-switch-bios.img

      - name: Build interrupt-safe round-trip kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c2d-ci-roundtrip-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-roundtrip-bios.img

      - name: Build IRQ-on-task-stack kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c2e-ci-irq-stack-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-irq-task-stack-bios.img

      - name: Build timer trap-frame kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c2f-ci-trap-frame-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-timer-trap-frame-bios.img

      - name: Validate host debug tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/events.py --check
          python3 -m py_compile tools/events.py tools/symbolize-backtrace.py
          bash -n tools/qemu-gdb.sh

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Boot default BIOS image
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=2s 8s             qemu-system-x86_64               -drive "format=raw,file=target/ci/freeworldos-default-bios.img"               -serial stdio               -display none               -no-reboot               -no-shutdown               -m 256M             > default-boot-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat default-boot-serial.log

          grep -Fq "FreeWorldOS: M1 foundation online" default-boot-serial.log
          grep -Fq "FreeWorldOS: bootstrap initialization complete" default-boot-serial.log
          grep -Eq "apic: timer calibration .*median_hz=[1-9][0-9]*" default-boot-serial.log
          grep -Eq "irq: APIC timer delivery proven .*ticks=[1-9][0-9]* IF=on" default-boot-serial.log
          grep -Eq "rt: time source online ticks=[1-9][0-9]* period_ns=[1-9][0-9]*" default-boot-serial.log

          if grep -Fq "KERNEL PANIC" default-boot-serial.log             || grep -Fq "FreeWorldOS: FATAL" default-boot-serial.log             || grep -Fq "FreeWorldOS: EXCEPTION:" default-boot-serial.log; then
            echo "unexpected panic or exception during default M1 boot" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi

      - name: Boot self-test BIOS image and verify milestone proofs
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=2s 8s             qemu-system-x86_64               -drive "format=raw,file=target/ci/freeworldos-selftest-bios.img"               -serial stdio               -display none               -no-reboot               -no-shutdown               -m 256M             > selftest-boot-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat selftest-boot-serial.log

          grep -Fq "FreeWorldOS: M1 memory self-test: passed" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M3 heap self-test: passed" selftest-boot-serial.log
          grep -Eq "memory: frame-state bitmap .*bytes=[1-9][0-9]* pages=[1-9][0-9]* tracked_frames=[1-9][0-9]*" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-A frame reuse self-test: passed bitmap_state=ok available=[1-9][0-9]* returned_total=[1-9][0-9]* reused_total=[1-9][0-9]*" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M3 object self-test: passed reuse_iterations=[1-9][0-9]* duplicate_subset=ok shared_lifetime=ok table_full_drop=ok live_objects=0 live_heap_allocations=0" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m1.memory" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m1.exception.breakpoint" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m3.heap" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m3.5a.frame_reuse" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m3.object" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m3.5b.event_ring" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m3.5c.task_stack" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M3.5-C task-stack self-test: passed object=ok stack_writable=ok stack_pages=4 returned_frames=4" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m3.5c.ownership" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M3.5-C ownership self-test: passed runnable_close=denied saved_rsp_close=denied guard_reservation=ok sysv_rsp_align=ok" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: EVENT seq=[1-9][0-9]* .* id=0x0300 " selftest-boot-serial.log
          grep -Fq "FreeWorldOS: EXCEPTION: #BP breakpoint" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M1 exception self-test: resumed" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M1 foundation online" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: bootstrap initialization complete" selftest-boot-serial.log
          grep -Eq "apic: timer calibration .*median_hz=[1-9][0-9]*" selftest-boot-serial.log
          grep -Eq "irq: APIC timer delivery proven .*ticks=[1-9][0-9]* IF=on" selftest-boot-serial.log
          grep -Eq "rt: time source online ticks=[1-9][0-9]* period_ns=[1-9][0-9]*" selftest-boot-serial.log

          if grep -Fq "KERNEL PANIC" selftest-boot-serial.log             || grep -Fq "FreeWorldOS: FATAL" selftest-boot-serial.log; then
            echo "panic or fatal exception detected during M1 self-test boot" >&2
            exit 1
          fi

          if grep -F "FreeWorldOS: EXCEPTION:" selftest-boot-serial.log             | grep -Fv "FreeWorldOS: EXCEPTION: #BP breakpoint"; then
            echo "unexpected exception detected during M1 self-test boot" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi


      - name: Boot deliberate panic image and verify fixed diagnostics
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=2s 8s \
            qemu-system-x86_64 \
              -drive "format=raw,file=target/ci/freeworldos-panic-bios.img" \
              -serial stdio \
              -display none \
              -no-reboot \
              -no-shutdown \
              -m 256M \
            > panic-boot-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat panic-boot-serial.log

          grep -Fq "FreeWorldOS: KERNEL PANIC" panic-boot-serial.log
          grep -Fq "FreeWorldOS: PANIC message=M3.5-B deliberate panic test" panic-boot-serial.log
          grep -Eq "FreeWorldOS: BACKTRACE begin frames=[1-9][0-9]*" panic-boot-serial.log
          grep -Eq "FreeWorldOS: BT\[[0-9][0-9]\]=0x[0-9a-f]+" panic-boot-serial.log
          grep -Fq "FreeWorldOS: EVENT-RING begin" panic-boot-serial.log
          grep -Eq "FreeWorldOS: EVENT seq=[1-9][0-9]* .* id=0x0204 " panic-boot-serial.log
          grep -Eq "FreeWorldOS: EVENT seq=[1-9][0-9]* .* id=0x0300 " panic-boot-serial.log

          if grep -Fq "PANIC REENTRY" panic-boot-serial.log; then
            echo "panic diagnostics recursively panicked" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi


      - name: Boot deliberate fatal page-fault image and verify diagnostics
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=2s 8s \
            qemu-system-x86_64 \
              -drive "format=raw,file=target/ci/freeworldos-fatal-bios.img" \
              -serial stdio \
              -display none \
              -no-reboot \
              -no-shutdown \
              -m 256M \
            > fatal-boot-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat fatal-boot-serial.log

          grep -Fq "FreeWorldOS: FATAL" fatal-boot-serial.log
          grep -Fq "FreeWorldOS: EXCEPTION: #PF page fault" fatal-boot-serial.log
          grep -Eq "fault=0x300000000000" fatal-boot-serial.log
          grep -Eq "FreeWorldOS: BACKTRACE begin frames=[1-9][0-9]*" fatal-boot-serial.log
          grep -Eq "FreeWorldOS: BT\[[0-9][0-9]\]=0x[0-9a-f]+" fatal-boot-serial.log
          grep -Eq "FreeWorldOS: EVENT seq=[1-9][0-9]* .* id=0x0203 " fatal-boot-serial.log
          grep -Eq "FreeWorldOS: EVENT seq=[1-9][0-9]* .* id=0x0300 " fatal-boot-serial.log

          if grep -Fq "PANIC REENTRY" fatal-boot-serial.log; then
            echo "fatal diagnostics recursively panicked" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi


      - name: Boot deliberate task guard-fault image and verify #PF
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=2s 8s \
            qemu-system-x86_64 \
              -drive "format=raw,file=target/ci/freeworldos-task-guard-bios.img" \
              -serial stdio \
              -display none \
              -no-reboot \
              -no-shutdown \
              -m 256M \
            > task-guard-boot-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat task-guard-boot-serial.log

          grep -Fq "FreeWorldOS: M3.5-C guard fault test:" task-guard-boot-serial.log
          grep -Fq "guard=0xffffa00000000000" task-guard-boot-serial.log
          grep -Fq "FreeWorldOS: FATAL" task-guard-boot-serial.log
          grep -Fq "FreeWorldOS: EXCEPTION: #PF page fault" task-guard-boot-serial.log
          grep -Fq "fault=0xffffa00000000000" task-guard-boot-serial.log

          if grep -Fq "PANIC REENTRY" task-guard-boot-serial.log; then
            echo "guard-page fatal diagnostics recursively panicked" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi


      - name: Boot voluntary A-to-B switch image
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=2s 8s \
            qemu-system-x86_64 \
              -drive "format=raw,file=target/ci/freeworldos-voluntary-switch-bios.img" \
              -serial stdio \
              -display none \
              -no-reboot \
              -no-shutdown \
              -m 256M \
            > voluntary-switch-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat voluntary-switch-serial.log

          grep -Fq "FreeWorldOS: M3.5-C2c scheduler refs: owned handles=closed" voluntary-switch-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2c task A: running task_id=[1-9][0-9]*" voluntary-switch-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2c task B: running task_id=[1-9][0-9]* saved_a_rsp=0xffffa[0-9a-f]+" voluntary-switch-serial.log
          grep -Fq "FreeWorldOS: M3.5-C2c voluntary switch: passed A->B scheduler_refs=owned timer_preemption=off" voluntary-switch-serial.log

          if grep -Fq "KERNEL PANIC" voluntary-switch-serial.log \
            || grep -Fq "PANIC REENTRY" voluntary-switch-serial.log \
            || grep -Fq "FreeWorldOS: FATAL" voluntary-switch-serial.log \
            || grep -Fq "FreeWorldOS: EXCEPTION:" voluntary-switch-serial.log; then
            echo "unexpected panic or exception during C2c voluntary switch proof" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi


      - name: Boot interrupt-safe A-to-B-to-A round-trip image
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=2s 8s \
            qemu-system-x86_64 \
              -drive "format=raw,file=target/ci/freeworldos-roundtrip-bios.img" \
              -serial stdio \
              -display none \
              -no-reboot \
              -no-shutdown \
              -m 256M \
            > roundtrip-switch-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat roundtrip-switch-serial.log

          grep -Fq "FreeWorldOS: M3.5-C2c scheduler refs: owned handles=closed" roundtrip-switch-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2c task A: running task_id=[1-9][0-9]*" roundtrip-switch-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2c task B: running task_id=[1-9][0-9]* saved_a_rsp=0xffffa[0-9a-f]+" roundtrip-switch-serial.log
          grep -Fq "FreeWorldOS: M3.5-C2d task B: yielding back to A if=on" roundtrip-switch-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2d task A: resumed saved_b_rsp=0xffffa[0-9a-f]+ if=on" roundtrip-switch-serial.log
          grep -Fq "FreeWorldOS: M3.5-C2d round trip: passed A->B->A scheduler_refs=owned interrupt_window=closed if_policy=resume_enabled timer_preemption=off" roundtrip-switch-serial.log

          if grep -Fq "KERNEL PANIC" roundtrip-switch-serial.log \
            || grep -Fq "PANIC REENTRY" roundtrip-switch-serial.log \
            || grep -Fq "FreeWorldOS: FATAL" roundtrip-switch-serial.log \
            || grep -Fq "FreeWorldOS: EXCEPTION:" roundtrip-switch-serial.log; then
            echo "unexpected panic or exception during C2d round-trip proof" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi


      - name: Boot timer IRQ-on-task-stack proof image
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=2s 8s \
            qemu-system-x86_64 \
              -drive "format=raw,file=target/ci/freeworldos-irq-task-stack-bios.img" \
              -serial stdio \
              -display none \
              -no-reboot \
              -no-shutdown \
              -m 256M \
            > irq-task-stack-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat irq-task-stack-serial.log

          grep -Eq "FreeWorldOS: M3.5-C2e irq_on_task_stack=ok task=B before=[0-9]+ after=[1-9][0-9]*" irq-task-stack-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2e irq_on_task_stack=ok task=A before=[0-9]+ after=[1-9][0-9]*" irq-task-stack-serial.log
          grep -Fq "FreeWorldOS: M3.5-C2e irq-on-task-stack: passed A=ok B=ok target_rsp_under_cli=ok timer_preemption=off" irq-task-stack-serial.log

          if grep -Fq "KERNEL PANIC" irq-task-stack-serial.log \
            || grep -Fq "PANIC REENTRY" irq-task-stack-serial.log \
            || grep -Fq "FreeWorldOS: FATAL" irq-task-stack-serial.log \
            || grep -Fq "FreeWorldOS: EXCEPTION:" irq-task-stack-serial.log; then
            echo "unexpected panic or exception during C2e IRQ-on-task-stack proof" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi


      - name: Boot timer full-frame same-task IRETQ proof
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=2s 8s \
            qemu-system-x86_64 \
              -drive "format=raw,file=target/ci/freeworldos-timer-trap-frame-bios.img" \
              -serial stdio \
              -display none \
              -no-reboot \
              -no-shutdown \
              -m 256M \
            > timer-trap-frame-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat timer-trap-frame-serial.log

          grep -Fq "FreeWorldOS: M3.5-C2f timer frame: starting same-task iretq proof" timer-trap-frame-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2f timer frame: frame=0xffffa[0-9a-f]+ bytes=160 alignment=ok kind=interrupt in_stack=ok hardware_rsp=ok rsp_delta=160\|168 frame_fields=ok interrupted_if=on all_gprs=ok depth=clear eoi_before_scheduler=locked iret_same_task=ok" timer-trap-frame-serial.log
          grep -Fq "FreeWorldOS: M3.5-C2f trap-frame proof: passed timer_only=ok switch=off" timer-trap-frame-serial.log

          if grep -Fq "KERNEL PANIC" timer-trap-frame-serial.log \
            || grep -Fq "PANIC REENTRY" timer-trap-frame-serial.log \
            || grep -Fq "FreeWorldOS: FATAL" timer-trap-frame-serial.log \
            || grep -Fq "FreeWorldOS: EXCEPTION:" timer-trap-frame-serial.log; then
            echo "unexpected panic or exception during C2f timer-frame proof" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi
