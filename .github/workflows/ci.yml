name: CI

on:
  push:
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
          components: llvm-tools-preview,rust-src
          targets: x86_64-unknown-none,x86_64-unknown-uefi

      - name: Build default kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build
          mkdir -p target/ci
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n'               | sort -nr               | head -n 1               | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-default-bios.img

      - name: Build kernel image with self-tests
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m1-ci-self-test,m3-ci-self-test,m35a-ci-self-test,m35b-ci-self-test,m35c-ci-self-test,m35c2b-ci-self-test,m4a-ci-self-test,m4b-ci-self-test,m4c-ci-self-test,m4d-ci-self-test,m4e-ci-self-test,m5a-ci-self-test,m5b-ci-self-test,m5c-ci-self-test,m5d-ci-self-test,m5e-ci-self-test,m5f-ci-self-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n'               | sort -nr               | head -n 1               | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-selftest-bios.img

      - name: Build panic-test kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35b-ci-panic-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-panic-bios.img

      - name: Build fatal-test kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35b-ci-fatal-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-fatal-bios.img

      - name: Build task guard-fault kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c-ci-guard-fault-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-task-guard-bios.img

      - name: Build voluntary-switch kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c2c-ci-switch-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-voluntary-switch-bios.img

      - name: Build interrupt-safe round-trip kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c2d-ci-roundtrip-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-roundtrip-bios.img

      - name: Build IRQ-on-task-stack kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c2e-ci-irq-stack-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-irq-task-stack-bios.img

      - name: Build timer trap-frame kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c2f-ci-trap-frame-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-timer-trap-frame-bios.img

      - name: Build interrupt-frame resume kernel image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c2g-ci-resume-interrupt-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-interrupt-resume-bios.img

      - name: Build timer round-robin preemption image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c2i-ci-preempt-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-timer-round-robin-bios.img

      - name: Build variable run-queue scheduler image
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features m35c2j-ci-run-queue-test
          BIOS_IMAGE="$(
            find target -type f -name 'freeworldos-bios.img' -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"
          test -n "$BIOS_IMAGE"
          cp "$BIOS_IMAGE" target/ci/freeworldos-run-queue-bios.img

      - name: Validate host debug tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/events.py --check
          python3 -m py_compile tools/events.py tools/symbolize-backtrace.py
          bash -n tools/qemu-gdb.sh

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Boot default BIOS image
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=2s 8s             qemu-system-x86_64               -drive "format=raw,file=target/ci/freeworldos-default-bios.img"               -serial stdio               -display none               -no-reboot               -no-shutdown               -m 256M             > default-boot-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat default-boot-serial.log

          grep -Fq "FreeWorldOS: M1 foundation online" default-boot-serial.log
          grep -Fq "FreeWorldOS: bootstrap initialization complete" default-boot-serial.log
          grep -Fq "memory: address-space split user=[0x1000..0x800000000000) kernel_start=0xffff800000000000 kernel_image=0xffff810000000000 kernel_stack=0xffff820000001000 boot_info=0xffff830000000000 phys_map=0xffffc00000000000" default-boot-serial.log
          grep -Eq "apic: timer calibration .*median_hz=[1-9][0-9]*" default-boot-serial.log
          grep -Eq "irq: APIC timer delivery proven .*ticks=[1-9][0-9]* IF=on" default-boot-serial.log
          grep -Eq "rt: time source online ticks=[1-9][0-9]* period_ns=[1-9][0-9]*" default-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2k default scheduler: queue=online capacity=8 idle_task=[1-9][0-9]* IF=handoff" default-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2k default scheduler: idle=running timer_return=ok tick_before=[0-9]+ tick_after=[1-9][0-9]* queue_empty=ok" default-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2m spawn: task=A task_id=[1-9][0-9]* slot=0 api=spawn_kernel_task" default-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2m spawn: task=B task_id=[1-9][0-9]* slot=1 api=spawn_kernel_task" default-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2m task A: running task_id=[1-9][0-9]* slot=0 source=timer idle_saved=interrupt IF=on" default-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2m task B: running task_id=[1-9][0-9]* slot=1 source=timer a_saved=interrupt IF=on" default-boot-serial.log
          grep -Fq "FreeWorldOS: M3.5-C2m task B: work=complete exit=begin" default-boot-serial.log
          grep -Fq "FreeWorldOS: M3.5-C2m task A: resumed b_exit=ok b_reclaimed=ok exit=begin" default-boot-serial.log
          test "$(grep -Fc "FreeWorldOS: scheduler idle reclaimed stopped_tasks=1" default-boot-serial.log)" -ge 1
          grep -Fq "FreeWorldOS: M3.5-C2m proof: spawn_api=ok tasks=2 timer_dispatch=ok interrupt_resume=ok exits=2 off_stack_reclaim=2 queue_empty=ok idle_resumed=ok priorities=off smp=off" default-boot-serial.log

          if grep -Fq "KERNEL PANIC" default-boot-serial.log             || grep -Fq "FreeWorldOS: FATAL" default-boot-serial.log             || grep -Fq "FreeWorldOS: EXCEPTION:" default-boot-serial.log; then
            echo "unexpected panic or exception during default M1 boot" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi

      - name: Boot self-test BIOS image and verify milestone proofs
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=2s 8s             qemu-system-x86_64               -drive "format=raw,file=target/ci/freeworldos-selftest-bios.img"               -serial stdio               -display none               -no-reboot               -no-shutdown               -m 256M             > selftest-boot-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat selftest-boot-serial.log

          grep -Fq "FreeWorldOS: M1 memory self-test: passed" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M3 heap self-test: passed" selftest-boot-serial.log
          grep -Eq "memory: frame-state bitmap .*bytes=[1-9][0-9]* pages=[1-9][0-9]* tracked_frames=[1-9][0-9]*" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-A frame reuse self-test: passed bitmap_state=ok available=[1-9][0-9]* returned_total=[1-9][0-9]* reused_total=[1-9][0-9]*" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M3 object self-test: passed reuse_iterations=[1-9][0-9]* duplicate_subset=ok shared_lifetime=ok table_full_drop=ok live_objects=0 live_heap_allocations=0" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m1.memory" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m1.exception.breakpoint" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m3.heap" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m3.5a.frame_reuse" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m3.object" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m3.5b.event_ring" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m3.5c.task_stack" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M3.5-C task-stack self-test: passed object=ok stack_writable=ok stack_pages=4 returned_frames=4" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m3.5c.ownership" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m5a.address_space" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M5-A address-space self-test: passed boot_mappings=higher kernel_lower=refused user_higher=refused user_lower=ok kernel_higher=ok null_user=reserved" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m5b.privilege_setup" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M5-B privilege setup: user_ss=0x1b user_cs=0x23 rsp0=0xffff[0-9a-f]+ stack_bytes=16384 gdt_order=kernel_code>kernel_data>user_data>user_code>tss" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M5-B privilege self-test: passed user_code=dpl3 user_data=dpl3 rpl3=ok sysret_order=ok tss_rsp0=higher stack_writable=ok current_cpl=ring0 ring3_entry=off callgate=off" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m5c.ring3_roundtrip" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M5-C ring3 entry: rip=0x400010000000 rsp=0x400010001ff0 cs=0x23 ss=0x1b if=off return_vector=0xf1" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M5-C gate: vector=0xf1 frame=0xffff[0-9a-f]+ user_cs=0x23 user_ss=0x1b user_rip=0x40001000000d user_rsp=0x400010001fe8 rsp0=ok marker=ok" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M5-C ring3 return: frame=0xffff[0-9a-f]+ rsp0_stack=ok user_rip=ok user_rsp=ok user_stack_marker=ok cpl3=observed cpl0=restored kernel_ss=restored frames_recycled=ok" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M5-C privilege round-trip: passed iretq_to_ring3=ok user_rx=ok user_rw_nx=ok dpl3_int_gate=test_only tss_rsp0=used ring0_return=ok scheduler=off user_task=off callgate=off" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m5d.process_address_space" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M5-D process roots: first=0x[0-9a-f]+ second=0x[0-9a-f]+ kernel=0x[0-9a-f]+ distinct=ok lower_private_empty=ok higher_shared=ok higher_user=off" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M5-D process address-space self-test: passed process_object=ok own_pml4=ok lower_half=private_empty higher_half=kernel_shared root_reclaim=2 cr3_switch=off user_execution=off preemption=off callgate=off" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m5e.process_user_leaf" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M5-E inactive leaf: root=0x[0-9a-f]+ peer=0x[0-9a-f]+ virtual=0x500020000000 data=0x[0-9a-f]+ ancestors=user leaf=rw_nx peer_lower=empty kernel_half=shared active_cr3=unchanged" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M5-E process user-leaf self-test: passed inactive_mapping=ok user_leaf=1 ancestors=3 user_writable=ok leaf_nx=ok isolated_peer=ok rollback_rejected=ok frames_returned=6 cr3_switch=off user_execution=off callgate=off" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m5f.process_cr3_roundtrip" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M5-F CR3 roundtrip: kernel_before=0x[0-9a-f]+ process=0x[0-9a-f]+ kernel_after=0x[0-9a-f]+ virtual=0x500020000000 value=0x4d354650524f4345 peer_root=0x[0-9a-f]+ kernel_leaf_absent=ok" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M5-F process CR3 self-test: passed process_cr3=loaded user_virtual_rw=ok kernel_cr3=restored kernel_root_leaf=absent physical_direct_map=match peer_isolated=ok frames_returned=6 if=masked cpl0=only preemption=off callgate=off" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M3.5-C ownership self-test: passed runnable_close=denied saved_rsp_close=denied guard_reservation=ok sysv_rsp_align=ok" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: EVENT seq=[1-9][0-9]* .* id=0x0300 " selftest-boot-serial.log
          grep -Fq "FreeWorldOS: EXCEPTION: #BP breakpoint" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M1 exception self-test: resumed" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M1 foundation online" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: bootstrap initialization complete" selftest-boot-serial.log
          grep -Fq "memory: address-space split user=[0x1000..0x800000000000) kernel_start=0xffff800000000000 kernel_image=0xffff810000000000 kernel_stack=0xffff820000001000 boot_info=0xffff830000000000 phys_map=0xffffc00000000000" selftest-boot-serial.log
          grep -Eq "apic: timer calibration .*median_hz=[1-9][0-9]*" selftest-boot-serial.log
          grep -Eq "irq: APIC timer delivery proven .*ticks=[1-9][0-9]* IF=on" selftest-boot-serial.log
          grep -Eq "rt: time source online ticks=[1-9][0-9]* period_ns=[1-9][0-9]*" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2k default scheduler: queue=online capacity=8 idle_task=[1-9][0-9]* IF=handoff" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2k default scheduler: idle=running timer_return=ok tick_before=[0-9]+ tick_after=[1-9][0-9]* queue_empty=ok" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2m spawn: task=A task_id=[1-9][0-9]* slot=0 api=spawn_kernel_task" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2m spawn: task=B task_id=[1-9][0-9]* slot=1 api=spawn_kernel_task" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2m task A: running task_id=[1-9][0-9]* slot=0 source=timer idle_saved=interrupt IF=on" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M3.5-C2m task B: running task_id=[1-9][0-9]* slot=1 source=timer a_saved=interrupt IF=on" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M3.5-C2m task B: work=complete exit=begin" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M3.5-C2m task A: resumed b_exit=ok b_reclaimed=ok exit=begin" selftest-boot-serial.log
          test "$(grep -Fc "FreeWorldOS: scheduler idle reclaimed stopped_tasks=1" selftest-boot-serial.log)" -ge 1
          grep -Fq "FreeWorldOS: M3.5-C2m proof: spawn_api=ok tasks=2 timer_dispatch=ok interrupt_resume=ok exits=2 off_stack_reclaim=2 queue_empty=ok idle_resumed=ok priorities=off smp=off" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: SELFTEST PASS name=m4a.vfs_graph" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M4-A VFS graph self-test: passed binary_names=ok exact_lookup=ok ram_file=ok root_identity=ok separators=projection_only" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M4-B VFS tasks: writer_id=[1-9][0-9]* writer_slot=0 reader_id=[1-9][0-9]* reader_slot=1 source=spawn_kernel_task" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M4-B writer: created dir=[1-9][0-9]* file=[1-9][0-9]* bytes=7 global=production" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M4-B reader: resolved file=[1-9][0-9]* bytes=7 writer_data=match mutation=committed" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: M4-B proof: global_namespace=ok cross_task_persistence=ok stable_node_ids=ok binary_bytes=ok reader_mutation_visible=ok scheduler_tasks=ok" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M4-C roots: native_node=[1-9][0-9]* linux_root=[1-9][0-9]* windows_c_root=[1-9][0-9]* aliases=explicit" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M4-C projection proof: linux_root=[1-9][0-9]* windows_c_root=[1-9][0-9]* file_node=[1-9][0-9]* same_native_object=ok explicit_visibility=ok" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M4-D Linux path proof: input_hex=2f73746174655c62696e file_node=[1-9][0-9]* raw_bytes=ok backslash=data repeated_slash=collapsed dot_traversal=refused" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M4-E writer: windows_file=[1-9][0-9]* wtf8_unpaired_surrogate=stored bytes=11" selftest-boot-serial.log
          grep -Eq "FreeWorldOS: M4-E Windows path proof: drive=C file_node=[1-9][0-9]* utf16=ok wtf8_unpaired_surrogate=ok lowercase_drive=normalized dot_traversal=refused" selftest-boot-serial.log
          grep -Fq "FreeWorldOS: scheduler idle reclaimed stopped_tasks=2" selftest-boot-serial.log

          if grep -Fq "KERNEL PANIC" selftest-boot-serial.log             || grep -Fq "FreeWorldOS: FATAL" selftest-boot-serial.log; then
            echo "panic or fatal exception detected during M1 self-test boot" >&2
            exit 1
          fi

          if grep -F "FreeWorldOS: EXCEPTION:" selftest-boot-serial.log             | grep -Fv "FreeWorldOS: EXCEPTION: #BP breakpoint"; then
            echo "unexpected exception detected during M1 self-test boot" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi


      - name: Boot deliberate panic image and verify fixed diagnostics
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=2s 8s \
            qemu-system-x86_64 \
              -drive "format=raw,file=target/ci/freeworldos-panic-bios.img" \
              -serial stdio \
              -display none \
              -no-reboot \
              -no-shutdown \
              -m 256M \
            > panic-boot-serial.log 2>&1
          QEMU_STATUS=$?
          set -e

          cat panic-boot-serial.log

          grep -Fq "FreeWorldOS: KERNEL PANIC" panic-boot-serial.log
          grep -Fq "FreeWorldOS: PANIC message=M3.5-B deliberate panic test" panic-boot-serial.log
          grep -Eq "FreeWorldOS: BACKTRACE begin frames=[1-9][0-9]*" panic-boot-serial.log
          grep -Eq "FreeWorldOS: BT\[[0-9][0-9]\]=0x[0-9a-f]+" panic-boot-serial.log
          grep -Fq "FreeWorldOS: EVENT-RING begin" panic-boot-serial.log
          grep -Eq "FreeWorldOS: EVENT seq=[1-9][0-9]* .* id=0x0204 " panic-boot-serial.log
          grep -Eq "FreeWorldOS: EVENT seq=[1-9][0-9]* .* id=0x0300 " panic-boot-serial.log

          if grep -Fq "PANIC REENTRY" panic-boot-serial.log; then
            echo "panic diagnostics recursively panicked" >&2
            exit 1
          fi

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "unexpected QEMU status: $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi


