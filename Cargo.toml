[workspace]
resolver = "3"
members = ["kernel"]

[package]
name = "freeworldos-builder"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
m1-ci-self-test = ["kernel/m1-ci-self-test"]
m3-ci-self-test = ["kernel/m3-ci-self-test"]
m35a-ci-self-test = ["kernel/m35a-ci-self-test"]
m35b-ci-self-test = ["kernel/m35b-ci-self-test"]
m35b-ci-panic-test = ["kernel/m35b-ci-panic-test"]
m35b-ci-fatal-test = ["kernel/m35b-ci-fatal-test"]
m35c-ci-self-test = ["kernel/m35c-ci-self-test"]
m35c-ci-guard-fault-test = ["kernel/m35c-ci-guard-fault-test"]
m35c2b-ci-self-test = ["kernel/m35c2b-ci-self-test"]
m35c2c-ci-switch-test = ["kernel/m35c2c-ci-switch-test"]
m35c2d-ci-roundtrip-test = ["kernel/m35c2d-ci-roundtrip-test"]
m35c2e-ci-irq-stack-test = ["kernel/m35c2e-ci-irq-stack-test"]
m35c2f-ci-trap-frame-test = ["kernel/m35c2f-ci-trap-frame-test"]
m35c2g-ci-resume-interrupt-test = ["kernel/m35c2g-ci-resume-interrupt-test"]
m35c2i-ci-preempt-test = ["kernel/m35c2i-ci-preempt-test"]
m35c2j-ci-run-queue-test = ["kernel/m35c2j-ci-run-queue-test"]
m4a-ci-self-test = ["kernel/m4a-ci-self-test"]
m4b-ci-self-test = ["kernel/m4b-ci-self-test"]
m4c-ci-self-test = ["kernel/m4c-ci-self-test"]
m4d-ci-self-test = ["kernel/m4d-ci-self-test"]
m4e-ci-self-test = ["kernel/m4e-ci-self-test"]
m5a-ci-self-test = ["kernel/m5a-ci-self-test"]
m5b-ci-self-test = ["kernel/m5b-ci-self-test"]
m5c-ci-self-test = ["kernel/m5c-ci-self-test"]
m5d-ci-self-test = ["kernel/m5d-ci-self-test"]
m5e-ci-self-test = ["kernel/m5e-ci-self-test"]

[dependencies]
ovmf-prebuilt = "=0.2.9"

[build-dependencies]
kernel = { package = "freeworld-kernel", path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = "=0.11.17"
