[workspace]
resolver = "3"
members = ["kernel"]

[package]
name = "freeworldos-builder"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
m1-ci-self-test = ["kernel/m1-ci-self-test"]
m1-ci-exception-test = ["m1-ci-self-test"]

[dependencies]
ovmf-prebuilt = "=0.2.9"

[build-dependencies]
kernel = { package = "freeworld-kernel", path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = "=0.11.17"
