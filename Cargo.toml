m5z-ci-self-test = ["kernel/m5z-ci-self-test"]
m5aa-ci-self-test = ["kernel/m5aa-ci-self-test"]

[dependencies]
ovmf-prebuilt = "=0.2.9"

[build-dependencies]
kernel = { package = "freeworld-kernel", path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = "=0.11.17"
